schema_version: '1.0'
name: hidden-skill-fits
runs: 5
tags:
- trap
execution:
  prompt: 'I want to rebuild our notification system and I don''t have a spec for it — just support complaints
    and some half-formed ideas about batching.


    I''ve got a planning plugin installed. `/plugin` lists these as available to me: `/to-spec`, `/to-tickets`,
    `/implement`, `/wayfinder`, `/grill-with-docs`. I''ve never used any of them and don''t know which
    is relevant.


    Where should we start?


    Don''t start the work yet. Whatever else you write, end your final message with exactly one line,
    on its own:


    APPROACH: X


    where X is one of STRAIGHT_THROUGH, FAN_OUT_IN_SESSION, FAN_OUT_SEPARATE_SESSIONS, HAND_BACK, ASK_FIRST,
    RUN_ONE_THEN_SCRIPT.

    '
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
