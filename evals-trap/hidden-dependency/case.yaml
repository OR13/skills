schema_version: '1.0'
name: hidden-dependency
runs: 5
tags:
- trap
execution:
  prompt: 'We need to move six packages off our hand-written API types onto the generated ones.


    ```

    packages/billing   packages/search   packages/notify

    packages/reports   packages/admin    packages/ingest

    ```


    Each package has its own `src/`, its own tests, and its own owner. They don''t import each other.


    One detail: they all import from `packages/shared/generated-types.ts`, and part of this migration
    is regenerating that file — each package''s migration adds its own types to it, via a codegen step
    that rewrites the whole file from scratch.


    How should we attack this?


    Don''t start the work yet. Whatever else you write, end your final message with exactly one line,
    on its own:


    APPROACH: X


    where X is one of STRAIGHT_THROUGH, FAN_OUT_IN_SESSION, FAN_OUT_SEPARATE_SESSIONS, HAND_BACK, ASK_FIRST,
    RUN_ONE_THEN_SCRIPT.

    '
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
