schema_version: '1.0'
name: eight-independent-audits
runs: 5
tags:
- trap
execution:
  prompt: 'We''re preparing for a SOC 2 audit and I need to know, for each of our eight services, whether
    it writes any customer PII to its application logs.


    ```

    services/billing  services/search  services/notify  services/reports

    services/admin    services/ingest  services/webhooks services/exports

    ```


    They''re independent — separate deploys, separate log config, no shared logging wrapper. Nothing needs
    changing yet, I just need the answer for each one.


    How should we get it?


    Don''t start the work yet. Whatever else you write, end your final message with exactly one line,
    on its own:


    APPROACH: X


    where X is one of STRAIGHT_THROUGH, FAN_OUT_IN_SESSION, FAN_OUT_SEPARATE_SESSIONS, HAND_BACK, ASK_FIRST,
    RUN_ONE_THEN_SCRIPT.

    '
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
