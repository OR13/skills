execution:
  prompt: 'Our customers want to keep their encryption keys in their own cloud KMS rather than ours, and
    still have our background jobs process their data.


    I genuinely don''t know if that''s possible with how our job queue works, or whether anyone does it
    this way. Nobody here has looked into it.


    Where should we start?


    Don''t start the work yet. Whatever else you write, end your final message with exactly one line,
    on its own:


    APPROACH: X


    where X is one of STRAIGHT_THROUGH, FAN_OUT_IN_SESSION, FAN_OUT_SEPARATE_SESSIONS, HAND_BACK, ASK_FIRST,
    RUN_ONE_THEN_SCRIPT.

    '
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
