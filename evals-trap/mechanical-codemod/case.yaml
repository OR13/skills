schema_version: '1.0'
name: mechanical-codemod
runs: 5
tags:
- trap
execution:
  prompt: 'We''re switching from `logger.info(msg, meta)` to `logger.info({ msg, ...meta })` across the
    codebase. It''s about 200 call sites in 140 files, all the same two-argument shape, all in TypeScript.


    No behaviour change intended — it''s purely the call signature.


    How should we do this?


    Don''t start the work yet. Whatever else you write, end your final message with exactly one line,
    on its own:


    APPROACH: X


    where X is one of STRAIGHT_THROUGH, FAN_OUT_IN_SESSION, FAN_OUT_SEPARATE_SESSIONS, HAND_BACK, ASK_FIRST,
    RUN_ONE_THEN_SCRIPT.

    '
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
