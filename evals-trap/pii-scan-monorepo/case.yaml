schema_version: '1.0'
name: pii-scan-monorepo
runs: 5
tags:
- trap
execution:
  prompt: 'One of our services logs the full request body on error, including auth headers. Six other
    services were forked from the same template and I don''t know which share the bug.


    `services/billing`, `services/search`, `services/notify`, `services/reports`, `services/admin`, `services/ingest`
    — independent, no shared code beyond the original template.


    How should we find out?


    Don''t start the work yet. Whatever else you write, end your final message with exactly one line,
    on its own:


    APPROACH: X


    where X is one of STRAIGHT_THROUGH, FAN_OUT_IN_SESSION, FAN_OUT_SEPARATE_SESSIONS, HAND_BACK, ASK_FIRST,
    RUN_ONE_THEN_SCRIPT.

    '
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
