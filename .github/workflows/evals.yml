name: skill evals

# Static only: no API key, no secrets, no model, seconds to run. It asserts the
# repo's invariants, that the skill still states its load-bearing constraints,
# and that every grader still classifies the recorded responses the way it did
# when it was tuned.
#
# The live agent evals are deliberately not here. They run on your machine,
# against your own credentials, before you mark a PR ready for review. See
# AGENTS.md and evals/README.md.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.claude-plugin/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks (free, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The three versions agree
        run: |
          python3 - <<'V'
          import json, re
          a = json.load(open(".claude-plugin/plugin.json"))["version"]
          b = json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"]
          c = re.search(r'version: "(.*)"', open("skills/one-shot/SKILL.md").read()).group(1)
          assert a == b == c, (a, b, c)
          print("versions agree:", a)
          V

      - name: Nothing executable ships
        run: |
          test ! -e skills/one-shot/scripts
          ! find skills -type f ! -name '*.md' | grep . || { echo "non-markdown file under skills/"; exit 1; }

      - name: Frontmatter stays within the spec
        run: |
          python3 - <<'V'
          import re
          fm = re.match(r"---\n(.*?)\n---", open("skills/one-shot/SKILL.md").read(), re.S).group(1)
          keys = {l.split(":")[0] for l in fm.splitlines() if l and not l.startswith((" ", "\t"))}
          allowed = {"name","description","license","compatibility","metadata","allowed-tools"}
          extra = keys - allowed
          assert not extra, f"frontmatter keys outside the spec: {extra}"
          print("frontmatter ok:", sorted(keys))
          V

      - name: SKILL.md stays under 500 lines
        run: test "$(wc -l < skills/one-shot/SKILL.md)" -lt 500

      - name: The skill still states its load-bearing constraints
        run: |
          set -e
          check() { grep -qiF "$2" "$1" || { echo "MISSING from $1: $2"; exit 1; }; }
          check skills/one-shot/SKILL.md "Two judges at most"
          check skills/one-shot/SKILL.md "Dispatch cold"
          check skills/one-shot/SKILL.md "Kill, do not collect"
          check skills/one-shot/SKILL.md "NO_FINDINGS_DETECTED"
          check skills/one-shot/SKILL.md "where this repository asserts the property"
          check skills/one-shot/references/dispatch.md "Asserted at"
          check skills/one-shot/references/dispatch.md "KILL or KEEP"
          echo "all constraints present"

      - name: Graders still replay the recorded responses
        run: |
          node -e '
          const fs=require("fs"),path=require("path");
          const exp=JSON.parse(fs.readFileSync("evals/fixtures/expectations.json","utf8"));
          let bad=0,n=0;
          for(const [c,graders] of Object.entries(exp)){
            if(c.startsWith("_")) continue;
            for(const [g,want] of Object.entries(graders)){
              const txt=fs.readFileSync(path.join("evals",c,"graders",g+".md"),"utf8");
              const pat=txt.match(/pattern: (.*)/)[1].trim().replace(/^'"'"'|'"'"'$/g,"");
              const fl=(txt.match(/flags: (.*)/)||[,""])[1].trim();
              let re; try{ re=new RegExp(pat,fl); }
              catch(e){ console.log(`BAD REGEX ${c}/${g}: ${e.message}`); bad++; continue; }
              for(const v of ["v4.3.0","v4.5.0"]){
                const got=re.test(fs.readFileSync(path.join("evals/fixtures",v,c+".txt"),"utf8"));
                n++;
                if(got!==want[v]){ console.log(`MISMATCH ${c}/${g} ${v}: got ${got}, recorded ${want[v]}`); bad++; }
              }
            }
          }
          if(bad){ console.log(`${bad} problem(s)`); process.exit(1); }
          console.log(`all ${n} grader/fixture pairs replay as recorded`);
          '

