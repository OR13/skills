name: skill evals

# Cost control, in order of how much they save:
#   - paths filter: only runs when the skill, its evals, or the manifests change
#   - runs: 1 per case (set in each case.yaml); raise locally when tuning
#   - --ablation none: skips the no-plugin baseline arm, which would double the spend
#   - concurrency: a new push cancels the previous run on the same branch
# Three cases at one run each costs roughly $1.60 and takes about 8 minutes.
# Grading is deterministic (regex + tool_used), so it adds nothing to that.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'evals/**'
      - '.claude-plugin/**'
      - '.github/workflows/evals.yml'
  workflow_dispatch:

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Check the three versions agree
        run: |
          python3 - <<'V'
          import json, re
          a = json.load(open(".claude-plugin/plugin.json"))["version"]
          b = json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"]
          c = re.search(r'version: "(.*)"', open("skills/one-shot/SKILL.md").read()).group(1)
          assert a == b == c, (a, b, c)
          print("versions agree:", a)
          V

      - name: No executables ship here
        run: test ! -e skills/one-shot/scripts

      - name: SKILL.md stays under 500 lines
        run: test "$(wc -l < skills/one-shot/SKILL.md)" -lt 500

      - name: Run the eval gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --eval-dir evals \
            --tag ci \
            --ablation none \
            --trust-plugin \
            --no-publish \
            --threshold 1.0 \
            --output-dir evals-results

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals-results/
          retention-days: 14
