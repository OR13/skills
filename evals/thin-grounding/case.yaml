schema_version: '1.0'
name: thin-grounding
runs: 1
execution:
  prompt: '(These files are not on disk in this session — treat the listing below as the repo.)


    This library is meant to parse CSV the way RFC 4180 describes it, but it was

    started last month and I don''t trust that it conforms.


    ```

    src/parse.ts     parse(text) -> splits on "\n", then on ","

    src/stringify.ts stringify(rows) -> joins with "," and "\n"

    src/types.ts     type Row = string[]

    README.md        one paragraph, links to RFC 4180

    ```


    That is the whole repo: no tests, no ADRs, no CI.


    I''m not sure how to tackle this or which pattern fits — there isn''t much in the

    repo to review against and no spec of our own. Work out the approach and show me

    the brief you''d hand a reviewing agent. Don''t dispatch it yet.


    Put the whole answer in your final message — the plan and every brief in one place, not spread across
    earlier messages or a file.

    '
  max_turns: 15
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
tags:
- ci
